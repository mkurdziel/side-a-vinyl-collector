name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build combined image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: ./Dockerfile.combined
        push: false
        tags: side-a-vinyl-collector:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
